[workspace]
resolver = "3"
members = ["crates/*", "examples/simulated-live"]

[workspace.package]
edition = "2024"
version = "1.2.2"
license = "MIT"

[workspace.dependencies]
trace-core = { path = "crates/trace-core" }
trace-storage = { path = "crates/trace-storage" }
trace-ingest = { path = "crates/trace-ingest" }
trace-render = { path = "crates/trace-render" }
trace-view = { path = "crates/trace-view" }
trace-adapter-sdk = { path = "crates/trace-adapter-sdk" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
ulid = "3.0.0"
